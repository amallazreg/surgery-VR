<body>
    <app-navbar></app-navbar>

    <div class="page-wrapper">
        <div class="login-page">
            <!-- Background animé -->
            <div class="login-background">
                <div class="animated-grid"></div>
                <div class="floating-shapes">
                    <div class="shape shape-1"></div>
                    <div class="shape shape-2"></div>
                    <div class="shape shape-3"></div>
                </div>
            </div>

            <!-- Left Panel - Welcome Section -->
       

            <!-- Right Panel - Form Section -->
            <div class="form-panel">
                <div class="form-container">
                    <!-- Carte de login -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="card-header">
                            <h2 class="card-title">Accédez à votre compte</h2>
                             <p class="card-subtitle">Connectez-vous pour gérer votre espace en toute sécurité.</p>

                        </div>


                        <!-- Formulaire de connexion -->
                        <form id="loginForm" class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            
                            <div class="form-group">
                                <label for="login-email">
                                    <span class="label-icon">📧</span>
                                    Email professionnel
                                </label>
                                <input 
                                    type="email" 
                                    id="login-email"
                                    class="form-input"
                                    placeholder="votre.email@exemple.com"
                                    formControlName="email"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="login-password">
                                    <span class="label-icon">🔒</span>
                                    Mot de passe
                                </label>
                                <div class="password-wrapper">
                                    <input 
                                        type="password" 
                                        id="login-password"
                                        class="form-input"
                                        placeholder="••••••••"
                                       formControlName="motDePasse"
                                        required>
                               

                                </div>
                            </div>

                            <div class="form-options">
                            
                                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || loginForm.invalid">
                                <span class="btn-text">Se connecter</span>
                                <span class="btn-icon">→</span>
                            </button>

                                <div class="login-link">
                        Vous n'avez pas un compte ? 
                        <a routerLink="/signun">Créer le ici</a>
                    </div>
                        </form>

                      
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer - FULL WIDTH -->
        <footer class="page-footer">
            <div class="footer-content">
                <p>© 2026 SurgeryVR. Tous droits réservés.</p>
            </div>
        </footer>
    </div>

   
</body>
